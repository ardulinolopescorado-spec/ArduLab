<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ArduLab">
<script>/* vira app instalável quando está num site próprio (ex.: GitHub Pages) */
(function(){try{if(location.protocol!=='https:'||/claude|anthropic/.test(location.hostname))return;
 var m=document.createElement('link');m.rel='manifest';m.href='manifest.json';document.head.appendChild(m);
 var i=document.createElement('link');i.rel='icon';i.href='icon-192.png';document.head.appendChild(i);
 var a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a);
 if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}})();</script>
<title>ArduLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: laboratório de desempenho esportivo, preciso e enérgico
   IDEA: o placar e a quadra de basquete — números grandes, linhas de quadra, laranja da bola
   PICTURE: o bonequinho animado fazendo o teste + gráfico ao vivo com o "fantasma" da última tentativa
   COLOUR and TYPE: grafite profundo, madeira de quadra, laranja de bola; Barlow Condensed nos números, Barlow no texto
   LAYOUT: app de celular — topo, uma coluna de cartões, barra de abas embaixo */
:root{color-scheme:light dark;
--bg:light-dark(#f3eee6,#0f1113);--card:light-dark(#ffffff,#181b1f);--card2:light-dark(#f8f4ee,#1f2328);
--ink:light-dark(#16181b,#f1efeb);--mute:light-dark(#5f666e,#98a0a8);--line:light-dark(#e2dace,#2a2f36);
--acc:#ff6b1a;--accD:#d4520a;--sideD:#ff6b1a;--sideE:#4ea8ff;--good:#2fbf71;--warn:#f2b233;--bad:#ef4b4b;
--ghost:light-dark(#9aa0a6,#6b737c);--body:light-dark(#c9bfb1,#4a525b);--body2:light-dark(#ddd5c9,#343a41);--steel:light-dark(#b7bdc3,#8a939c);--skin:light-dark(#d9a07c,#c98a66);--skin2:light-dark(#b98262,#9c6a4f);--jersey:light-dark(#2f5fa8,#3d6fb8);--jersey2:light-dark(#1f3f73,#25467a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.big,h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif}
h1{font-size:34px;line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:24px;line-height:1.1;margin:0 0 10px;font-weight:700}
h3{font-size:19px;margin:0;font-weight:600}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:86px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font:700 22px "Barlow Condensed",sans-serif;letter-spacing:.2px}
.logo svg{width:28px;height:28px}.logo img{width:34px;height:34px;min-width:34px;flex:none;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.sim{font-size:12px;line-height:1.15;color:var(--mute);min-width:0;margin-left:4px}.top .logo{flex:none}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.view{padding:16px;display:grid;gap:14px;animation:enter .35s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}.row.sb{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:13px;color:var(--mute);min-height:56px;border-radius:12px}
.tabs button svg{width:56px;height:30px;padding:3px 16px;box-sizing:border-box;border-radius:15px;transition:background .25s,color .25s}
.tabs button.on{color:var(--acc)}
.tabs button.on svg{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.tabs button.on{font-weight:700}
.btn{border:0;border-radius:14px;min-height:52px;padding:0 20px;font:600 17px Barlow,sans-serif;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px -8px var(--acc)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.w{width:100%}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font:700 44px "Barlow Condensed",sans-serif}
.ring .v span{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.met{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px;text-align:left;position:relative;overflow:hidden;animation:enter .4s ease backwards}
.met .lab{font-size:13px;color:var(--mute);line-height:1.25;min-height:32px}
.met .val{font:700 32px/1 "Barlow Condensed",sans-serif}
.met .val small{font-size:16px;color:var(--mute);font-weight:500;margin-left:2px}
.met .st{font-size:12.5px;font-weight:600}
.met svg.spark{width:100%;height:28px}
.met .ed{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.met .ed button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center}
.met .ed svg{width:16px;height:16px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-weight:600;font-size:15px;color:var(--mute)}
.seg.sc{overflow-x:auto;scrollbar-width:none}.seg.sc button{flex:0 0 auto;padding:0 12px;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;min-height:60px}
.li .ic{width:46px;height:46px;border-radius:12px;background:var(--card2);display:grid;place-items:center;overflow:hidden}
.li .ic svg{width:46px;height:46px}
.li .t{font-weight:600;line-height:1.2}
.li .s{font-size:13px;color:var(--mute)}
.li .r{text-align:right;font:600 20px "Barlow Condensed",sans-serif;line-height:1.1}
.li .r small{display:block;font:500 12px Barlow,sans-serif;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:38px;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.figbox{background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--acc) 14%,var(--card2)),var(--card2));border-radius:16px;border:1px solid var(--line);position:relative;overflow:hidden}
.figbox svg.fig{display:block;width:100%;height:auto;max-height:280px}
.figbox .lbl{position:absolute;left:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.rangebar{position:relative;height:40px;margin:28px 0 30px}
.rangebar .track{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.rangebar .band{position:absolute;top:15px;height:10px;background:color-mix(in srgb,var(--good) 45%,transparent);border-radius:6px}
.rangebar .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;font:600 13px "Barlow Condensed",sans-serif;transition:left .9s cubic-bezier(.2,.8,.2,1)}
.rangebar .mk i{width:4px;height:40px;border-radius:2px;display:block}
.rangebar .mk span{position:absolute;white-space:nowrap}
.rangebar .mk.up span{bottom:44px}.rangebar .mk.dn span{top:44px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--card2);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font:700 22px/1.1 "Barlow Condensed",sans-serif}
.stats span{font-size:12px;color:var(--mute)}
.chart{position:relative;height:220px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tipcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.tipcar .tip2{flex:0 0 86%;scroll-snap-align:start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14.5px}
.tip2 b{display:block;font-size:13px;color:var(--acc);margin-bottom:2px}
.live{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:enter .25s ease}
.live .lt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.live .body{flex:1;overflow:auto;padding:12px 14px 16px;display:grid;gap:10px;align-content:start;max-width:560px;width:100%;margin:0 auto}
.livetop{display:grid;grid-template-columns:42% 1fr;gap:10px;align-items:stretch}
.livetop .figbox svg.fig{max-height:190px}
.readout{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;align-content:space-between;gap:4px}
.readout .big{font:700 clamp(48px,14vw,66px)/0.95 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.readout .big small{font-size:20px;color:var(--mute)}
.delta{font:600 16px "Barlow Condensed",sans-serif}
.relrow{display:flex;align-items:center;gap:8px;font-size:13px}
.relbar{flex:1;height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.relbar i{display:block;height:100%;width:100%;background:var(--good);transition:width .3s,background .3s}
.cv{position:relative;height:250px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.balloon{position:absolute;left:10px;right:10px;top:8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35;box-shadow:0 8px 24px -10px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.balloon b{color:var(--acc)}
.balloon{padding-right:40px}.balloon .bx{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;border-radius:9px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center}
.savedok{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid color-mix(in srgb,var(--good) 45%,transparent);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.balloon:after{content:"";position:absolute;left:24px;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(-6px)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ctl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.pad{position:relative;width:86px;border-radius:16px;border:2px dashed var(--line);background:var(--card);touch-action:none;overflow:hidden;min-height:150px}
.pad i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--accD),var(--acc));transition:height .05s}
.pad span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;padding:6px;color:var(--mute);pointer-events:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font:700 120px "Barlow Condensed",sans-serif;color:var(--acc);pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.count.go{animation:boom .8s ease forwards}
@keyframes boom{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.0}}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:slide .35s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
@keyframes slide{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mgrid div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;animation:enter .4s ease backwards}
.mgrid b{display:block;font:700 22px/1.05 "Barlow Condensed",sans-serif}
.mgrid span{font-size:12px;color:var(--mute);line-height:1.2;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:600;font-size:14px}
.field{display:grid;gap:4px;font-size:14px}
.field input,.field select{font:16px Barlow,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.bodymap{display:grid;grid-template-columns:1fr;justify-items:center}
.bodymap svg{width:min(100%,320px);height:auto}
.bodymap .rg{cursor:pointer;transition:filter .2s,opacity .2s;stroke:var(--bg);stroke-width:2}
.bodymap .rg:hover{filter:brightness(1.15)}
.bodymap .rg.sel{animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{filter:brightness(1.35) drop-shadow(0 0 6px var(--acc))}}
.grad{height:10px;border-radius:6px;background:linear-gradient(90deg,hsl(0 75% 55%),hsl(40 85% 55%),hsl(80 60% 48%),hsl(130 55% 45%))}
.note{font-size:12.5px;color:var(--mute)}
[data-g]{cursor:help}
.gl{border-bottom:1.5px dotted currentColor}
.gi{position:relative}
.gi:after,.gl:after{content:"i";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--acc);color:#fff;font:700 10px/1 Barlow,sans-serif;margin-left:4px;vertical-align:2px}
.gi:after{position:absolute;top:6px;right:6px;margin:0}
.gi:not([data-g]):after{display:none}
.gi2{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--acc);font:700 14px/1 Barlow,sans-serif;z-index:2}
#gloss{position:fixed;z-index:95;max-height:calc(100vh - 20px);overflow:auto;width:min(340px,calc(100vw - 20px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.55);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
#gloss .ar{position:absolute;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
#gloss h4{margin:0 0 6px;font:700 21px/1.1 "Barlow Condensed",sans-serif;padding-right:36px}
#gloss .il{background:var(--card2);border-radius:12px;padding:6px;margin-bottom:8px}
#gloss .il svg{display:block;width:100%;height:auto}
#gloss p{margin:0 0 6px;font-size:14.5px;line-height:1.4}
#gloss .why{font-size:13.5px;color:var(--mute)}
#gloss .why b{color:var(--acc)}
#gloss .vx{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:0;background:var(--card2);display:grid;place-items:center}
.ilx .dr{stroke-dasharray:700;stroke-dashoffset:700;animation:drw 1.1s ease forwards}
.ilx .fa{opacity:0;animation:fin .5s ease .9s forwards}
.ilx .hl{animation:fin .5s ease .9s forwards,hlp 1.6s ease 1.4s infinite;opacity:0}
@keyframes drw{to{stroke-dashoffset:0}}
@keyframes fin{to{opacity:1}}
@keyframes hlp{50%{opacity:.45}}
body:has(.live) #askFab,body:has(.sheet.on) #askFab{bottom:auto;top:calc(112px + env(safe-area-inset-top));right:10px;width:42px;height:42px}
body:has(.sheet.on) #askFab{display:none}
.askin{color:#fff;background:var(--acc);border:0;font-weight:700;min-height:30px;padding:3px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
#askFab{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:#fff;box-shadow:0 10px 26px -8px rgba(255,107,26,.7);display:grid;place-items:center}
#askFab svg{width:26px;height:26px}
.ask{position:fixed;inset:0;z-index:92;display:none;background:rgba(0,0,0,.45)}
.ask.on{display:block}
.ask .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;height:88vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:enter .25s ease}
.ask .msgs{flex:1;overflow:auto;padding:12px 14px}
.ask .m{max-width:88%;padding:10px 12px;border-radius:16px;margin:6px 0;font-size:15px;line-height:1.5;white-space:pre-wrap}
.ask .m.u{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.ask .m.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.ask .bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.ask textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-height:44px;max-height:120px}
.ask .ib2{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);display:grid;place-items:center;flex:none}
.ask .ib2.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
button,.li,.card[data-go],.gi{transition:transform .12s ease,box-shadow .2s ease}
button:active,.li:active,.gi:active{transform:scale(.96)}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.relbar i{position:relative;overflow:hidden}
.relbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 2.8s linear infinite}
.tabs button.on svg{animation:tabpop .45s cubic-bezier(.2,1.6,.4,1)}

.tabs button{position:relative}
@keyframes tabpop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.figbox{position:relative;overflow:hidden}
.figbox::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,107,26,.10),transparent 30%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.li{animation:enter .35s ease backwards}
.list .li:nth-child(2){animation-delay:.04s}.list .li:nth-child(3){animation-delay:.08s}.list .li:nth-child(4){animation-delay:.12s}.list .li:nth-child(5){animation-delay:.16s}.list .li:nth-child(n+6){animation-delay:.2s}
.live.hot{box-shadow:inset 0 0 calc(var(--fx,0)*60px) calc(var(--fx,0)*6px) rgba(255,107,26,.45)}
#askFab{animation:fabin .5s cubic-bezier(.2,1.6,.4,1)}#askFab::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--acc);animation:ring 2.4s ease-out infinite}
@keyframes fabin{from{transform:scale(0)}}@keyframes ring{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cv .fov{display:none;position:absolute;right:12px;top:10px;text-align:right;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:none;z-index:3}
.cv .fov b{font:700 clamp(64px,22vw,110px)/.9 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.cv .fov small{font:600 22px 'Barlow Condensed',sans-serif;opacity:.85}
.cv .fov .fst{font:600 18px 'Barlow Condensed',sans-serif;opacity:.95}
.cv .fx{display:none;position:absolute;left:10px;bottom:10px;z-index:4;width:40px;height:40px;border-radius:12px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px}
.live.focus .livetop,.live.focus .legend,.live.focus #lvVoz,.live.focus .ctl>div:first-child{display:none}
.live.focus.fman .ctl{display:grid;grid-template-columns:1fr}
.live.focus.fman .ctl>div:first-child{display:none}
.live.focus:not(.fman) .ctl{display:none}
.live.focus .cv{height:calc(100vh - 92px - env(safe-area-inset-bottom));border:0;transition:height .45s cubic-bezier(.2,.8,.2,1),background .2s}
.live.focus.fman .cv{height:calc(100vh - 270px)}
.live.focus .cv .fov,.live.focus .cv .fx{display:block}
.live.focus .balloon{display:none}
.cv .fxv{left:58px}
body:has(.live.focus) #askFab{display:none}
.live .cv{transition:height .45s cubic-bezier(.2,.8,.2,1)}
.live.focus .body{padding-top:6px}
.tabs button{font-size:11.5px}
.gauge{display:grid;justify-items:center;text-align:center;gap:0}.gauge svg{width:100%;max-width:150px;height:auto;overflow:visible}.gauge b{font:700 24px/1 'Barlow Condensed',sans-serif;margin-top:-6px}.gauge b small{font-size:13px;color:var(--mute);margin-left:2px}.gauge span{font-size:12px;color:var(--mute);line-height:1.2}
.gauge .needle{transform-origin:60px 62px;transform:rotate(-90deg);animation:needle 1.1s cubic-bezier(.2,1.3,.4,1) forwards}@keyframes needle{to{transform:rotate(var(--a))}}
.gaugegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ringp{position:relative;display:grid;place-items:center;flex:none}.ringp b{position:absolute;inset:0;display:grid;place-items:center;font:700 18px 'Barlow Condensed',sans-serif}.ringp span{font-size:11px;color:var(--mute);margin-top:2px}
.ringp .rgo{stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.bullet .bt{position:relative;height:12px;border-radius:6px;background:var(--card2);margin:6px 0 4px}.bullet .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;animation:grow 1s ease}.bullet .bt em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
@keyframes grow{from{width:0}}
.waffle{display:grid;gap:4px;margin:8px 0 4px}.waffle i{aspect-ratio:1;border-radius:4px;animation:enter .4s ease backwards}
.phbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px}.phbar div{display:grid;gap:3px;text-align:center}.phbar i{height:8px;border-radius:4px;background:var(--card2)}.phbar span{font-size:10.5px;color:var(--mute)}.phbar .done i{background:var(--good)}.phbar .on i{background:var(--acc);animation:pulse 1.4s infinite}.phbar .on span{color:var(--acc);font-weight:700}
.crit{display:grid;gap:8px}.critc{display:flex;gap:12px;align-items:center;margin:0;padding:10px 12px;width:100%}
</style>

 lca:'Critérios de retorno mais usados: simetria do quadríceps ≥ 90% (Grindem 2016), quadríceps ≥ 3,0 N·m/kg no lado operado, saltos ≥ 90% de simetria e não voltar antes de 9 meses. Quem não cumpre os critérios tem ~4× mais nova ruptura (Kyritsis 2016). Aos 5–7 meses, 85% ainda não atingem a força exigida (Walaszek 2023). A força continua melhorando até 12–18 meses (Girdwood, BJSM 2024). Inibição artrogênica explica perda de força mesmo sem atrofia (Rice 2010).',
 rfd:'A explosão (RFD) dos primeiros 50–100 ms depende mais do sistema nervoso; dos 100–200 ms, mais do músculo (Maffiuletti 2016). O treino pesado e rápido aumenta a RFD precoce (Aagaard 2002). A RFD cai mais e volta mais devagar que o pico depois de lesão.',
 reacao:'Reação a som: em média 140–160 ms; a estímulo visual: 180–200 ms. Atletas costumam ser mais rápidos. Abaixo de 100 ms é antecipação (largada queimada). Sono, cansaço e cafeína mudam muito o resultado: use a média de 5 tentativas.',
 simetria:'Simetria (LSI) = lado mais fraco ÷ lado mais forte × 100. ≥ 90% é o alvo mais usado; diferenças de 10–15% já pedem atenção em atletas.',
 tecnica:'Boas práticas de um teste isométrico: aquecer 5 min + 2 tentativas leves (50% e 80%); 3 tentativas máximas de 3–5 s com 30–60 s de pausa; subir "o mais forte e rápido possível"; não dar tranco antes; mesma posição, ângulo, horário e cinta em todas as sessões; registrar dor e sono. A diferença entre testes abaixo de ~5–10% pode ser só erro de medida.',
 equilibrio:'Equilíbrio em uma perna no ArduLab: um sensor de movimento (MPU6050) preso na canela mede a aceleração 100 vezes por segundo durante 20 s com a pessoa parada numa perna. A oscilação é a variação dessa aceleração em mg (milésimos da gravidade): quanto menos a canela balança, melhor o controle. Também conta os toques do outro pé no chão (cada toque derruba a confiabilidade). A simetria compara o lado operado com o bom (lado bom ÷ lado operado, meta ≥ 90%). Não é uma plataforma de força: não mede o centro de pressão do pé, então os números não são comparáveis com tabelas de laboratório; servem para comparar lados e acompanhar a evolução. Referência provisória do app: abaixo de 20 mg = ótimo, 20–35 mg = média, acima de 35 mg = oscila muito.',
 sensores:'Sensores do ArduLab: célula de carga tipo S de 100 kg lida por um ADS1220 (24 bits) no ESP32-S3 para força isométrica; três MPU6050 (acelerômetro e giroscópio) em módulos XIAO ESP32-C3 sem fio para ângulo do joelho, saltos, aterrissagem e equilíbrio. Enquanto o hardware não chega, todos os dados são simulados.',
 normalizar:'Para comparar pessoas de pesos diferentes, divida pelo peso (N/kg ou N·m/kg) ou use o expoente 0,67 (alometria, Jaric 2002). Torque (N·m) = força (N) × distância da articulação até a cinta (m).'
};
function kbVal(it,t,p){ // converte a referência para kgf neste aparelho/perfil
 const lev=lever(t,p),toKgf=n=>n/9.81;
 const f=v=>{if(v==null)return null;if(it.k==='nmkg')return lev?toKgf(v*p.peso/lev):null;if(it.k==='nkg')return toKgf(v*p.peso);if(it.k==='n')return toKgf(v);if(it.k==='kg')return v;if(it.k==='nm')return lev?toKgf(v/lev):null;return null};
 if(it.m!=null)return {a:f(it.s!=null?it.m-it.s:it.m),b:f(it.s!=null?it.m+it.s:it.m),m:f(it.m)};
 return {a:f(it.lo),b:f(it.hi),m:null};
}
const KU={nmkg:'N·m/kg',nkg:'N/kg',n:'N',kg:'kg',nm:'N·m',rat:'',pct:'%',ms:'ms'};
const kd=v=>v>=20?0:v>=10||Math.round(v*10)/10===v?1:2;
function kbRaw(it){const u=KU[it.k];if(it.m!=null)return `${fmt(it.m,kd(it.m))}${it.s!=null?' ± '+fmt(it.s,kd(it.s)):''} ${u}`;return `${it.lo!=null?fmt(it.lo,kd(it.lo)):''}${it.hi!=null?'–'+fmt(it.hi,kd(it.hi)):it.lo!=null?' ou mais':''} ${u}`}
function kbFor(t,p){const K=KN[t.id];if(!K)return null;const items=K.it.filter(it=>!it.sx||it.sx===p.sexo).map(it=>{const v=kbVal(it,t,p);return {...it,v}});return {...K,items}}
function kbCard(t){const p=prof(),K=kbFor(t,p);const ss=sidesOf(t),L=ss.map(s=>({s,r:last(t.id,s)})).filter(o=>o.r);
 if(!K)return `<section class="card"><span class="tag" style="color:#2fa3ff">Referência publicada</span><p class="small" style="margin:6px 0 0">Ainda não há tabela confiável publicada para <b>${t.n.toLowerCase()}</b> com este tipo de aparelho. O app usa uma estimativa provisória; o melhor guia aqui é a simetria entre os lados e a sua própria evolução.</p></section>`;
 const row=it=>{const v=it.v,has=v&&v.a!=null;const you=has&&L.length?L.map(o=>{const pk=o.r.m.pk,ok=v.b!=null&&v.a!=null?(pk>=v.a?(pk>v.b&&v.b!==v.a?'acima':'dentro'):'abaixo'):'';return `<span style="color:${o.s==='E'?'var(--sideE)':o.s==='D'?'var(--sideD)':'var(--ink)'}">${o.s!=='-'?o.s+' ':''}${fmt(pk,1)}</span>${ok?` <b style="color:${ok==='abaixo'?'var(--bad)':'var(--good)'}">${ok}</b>`:''}`}).join(' · '):'';
  return `<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="row sb" style="align-items:flex-start"><span class="small" style="flex:1"><b>${it.pop}</b><br><span class="mute">${kbRaw(it)}${it.n?' · '+it.n:''}</span></span>${refChip(it.src)}</div>${has?`<div class="small" style="margin-top:3px">Para você (${p.peso} kg${lever(t,p)&&(it.k==='nmkg'||it.k==='nm')?', alavanca '+fmt(lever(t,p)*100,0)+' cm':''}): <b>${v.m!=null&&v.a===v.b?fmt(v.m,1):fmt(v.a,1)+(v.b!=null&&v.b!==v.a?'–'+fmt(v.b,1):' ou mais')} kgf</b>${you?' · você: '+you:''}</div>`:''}</div>`};
 return `<section class="card"><span class="tag" style="color:#2fa3ff">Referência publicada</span><h3 style="margin:2px 0 2px">O que os estudos consideram normal</h3><p class="note" style="margin:0 0 4px">Valores de artigos, convertidos para kgf no seu peso${lever(t,p)?' e na sua alavanca':''}. Populações e posições diferentes da sua mudam o número: use como guia.</p>
 ${K.items.map(row).join('')}${K.ext?`<p class="small" style="margin:8px 0 0">🏆 <b>Extraordinário:</b> ${K.ext}</p>`:''}${K.sem?`<p class="small mute" style="margin:6px 0 0">${K.sem}</p>`:''}${K.lca&&prof().op?`<p class="small" style="margin:6px 0 0">🦵 <b>LCA:</b> ${K.lca}</p>`:''}
 <details style="margin-top:6px"><summary class="small" style="cursor:pointer;font-weight:700;min-height:30px">Como fazer o teste do jeito dos estudos</summary><p class="small" style="margin:4px 0 0">${K.tec}</p></details></section>`}
function kbTool(test_id){const t=T[test_id];if(!t)throw new Error('teste desconhecido');const p=realProf(),K=kbFor(t,p),n=normOf(t,p);
 return {teste:t.n,perfil:{peso_kg:p.peso,idade:p.idade,sexo:p.sexo,alavanca_cm:lever(t,p)?Math.round(lever(t,p)*100):null},
  referencias_publicadas:K?K.items.map(it=>({populacao:it.pop,valor_original:kbRaw(it),convertido_kgf_para_este_atleta:it.v&&it.v.a!=null?{de:+it.v.a.toFixed(1),ate:it.v.b!=null?+it.v.b.toFixed(1):null,media:it.v.m!=null?+it.v.m.toFixed(1):null}:null,obs:it.n||null,fonte:REFS[it.src]?REFS[it.src][0].split(',')[0]+' '+REFS[it.src][3]+' — '+REFS[it.src][1]:it.src})):[],
  extraordinario:K&&K.ext||null,observacao:K&&K.sem||(!K?'Sem tabela publicada confiável para este teste com célula de carga; usar simetria e evolução própria.':null),lca:K&&K.lca||null,como_fazer:K&&K.tec||t.cue.join('; '),
  musculos:MUS[test_id]?MUS[test_id].m.map(m=>`${m[0]} ~${m[1]}% (${ROLE[m[2]][0]})`):[],
  ciencia:MUS[test_id]?MUS[test_id].sci.map(([tx,rf])=>tx+' ['+rf.map(k=>REFS[k]?REFS[k][0].split(',')[0]+' '+REFS[k][3]:k).join(', ')+']'):[],
  estimativa_provisoria_do_app_kgf:{faixa_comum:[+n.lo.toFixed(1),+n.hi.toFixed(1)],obs:'estimativa interna do app, menos confiável que as referências publicadas'}}}

/* ---------- LEITOR DE ESTUDOS (resumos detalhados dentro do app) ---------- */
/* o: objetivo · q: quem foi estudado · c: como · r: resultados · l: limitações · a: acesso (aberto/pago) */
const STUDY={
 ward09:{a:'pago',o:'Medir de forma precisa a arquitetura dos músculos da perna (massa, comprimento das fibras e área de secção transversa fisiológica, a PCSA).',q:'Membros inferiores de cadáveres de adultos.',c:'Dissecção de 27 músculos, com correção do comprimento das fibras pelo tamanho dos sarcômeros, que antes era a maior fonte de erro.',r:['Os músculos com maior PCSA (mais capacidade de força) são o sóleo e os vastos do quadríceps.','Os isquiotibiais e o sartório têm fibras longas: são feitos para trabalhar em grande amplitude, não para força máxima.','Tabelas antigas de arquitetura muscular tinham erros importantes; esta virou a referência.'],l:'Cadáveres de pessoas idosas; músculos de atletas jovens podem ter proporções diferentes.'},
 lieber00:{a:'pago',o:'Explicar como a arquitetura do músculo define o que ele faz.',q:'Revisão da literatura.',c:'Reúne estudos de anatomia, fisiologia e cirurgia.',r:['A força máxima de um músculo é proporcional à PCSA (quantas fibras trabalham lado a lado).','O comprimento das fibras define a amplitude e a velocidade com que o músculo trabalha.','Por isso dois músculos com o mesmo peso podem ter funções bem diferentes.'],l:'É uma revisão, não mede atletas; as porcentagens de cada músculo no app são estimativas baseadas nesse princípio.'},
 maff16:{a:'aberto',o:'Padronizar como medir e interpretar a taxa de desenvolvimento de força (RFD, a "explosão").',q:'Revisão de especialistas.',c:'Analisa fisiologia, fatores que influenciam a RFD e métodos de medição.',r:['Os primeiros 50–100 ms da subida dependem principalmente do comando nervoso; dos 100–200 ms em diante, cada vez mais da força máxima e do músculo.','A RFD é mais sensível que o pico para detectar efeitos de treino, fadiga e lesão.','Recomenda alta frequência de amostragem, detectar o início da contração com cuidado e instruir "o mais rápido e forte possível".','A RFD precoce tem mais variação entre testes que o pico: use várias tentativas.'],l:'As recomendações são para laboratório; em campo o ruído do sinal pesa mais.'},
 aag02:{a:'pago',o:'Ver se o treino de força pesado melhora a explosão (RFD) e o comando nervoso.',q:'Homens jovens saudáveis.',c:'14 semanas de treino pesado de pernas, com medida de força isométrica, RFD e eletromiografia antes e depois.',r:['A RFD nas primeiras dezenas de milissegundos aumentou.','A ativação elétrica (EMG) no início da contração também aumentou: o ganho foi em boa parte do sistema nervoso.','Treino pesado com intenção de velocidade melhora a explosão, não só o pico.'],l:'Poucos participantes e sem atletas de elite.'},
 aag98:{a:'pago',o:'Propor uma relação isquiotibiais:quadríceps que represente melhor o que acontece no movimento real.',q:'Adultos saudáveis treinados.',c:'Isocinético em várias velocidades, comparando a relação convencional (concêntrico ÷ concêntrico) com a funcional (excêntrico do isquio ÷ concêntrico do quadríceps).',r:['A relação convencional fica em torno de 0,5–0,6.','A relação funcional fica perto de 1,0 em velocidades altas: os isquiotibiais precisam frear o quadríceps.','A relação funcional é mais útil para pensar em proteção do joelho e do LCA.'],l:'Isocinético, não isométrico; no app usamos a relação isométrica como aproximação.'},
 grin16:{a:'pago',o:'Ver se critérios simples de retorno reduzem nova lesão depois da reconstrução do LCA.',q:'106 pessoas operadas do LCA, acompanhadas por 2 anos (coorte Delaware-Oslo).',c:'Mediram força do quadríceps, saltos e questionários antes de voltar ao esporte e registraram novas lesões no joelho.',r:['Voltar a esportes de pivô (como basquete) aumentou muito o risco de nova lesão.','Cada mês a mais de espera até 9 meses reduziu a nova lesão em cerca de 51%.','Cada 1% a mais de simetria do quadríceps reduziu o risco em cerca de 3%.','Quem cumpriu os critérios teve 84% menos nova lesão.'],l:'Amostra moderada e número pequeno de novas lesões.'},
 kyr16:{a:'pago',o:'Ver se cumprir critérios de alta antes de voltar ao esporte protege o enxerto do LCA.',q:'158 atletas homens profissionais operados do LCA, acompanhados depois do retorno.',c:'Bateria de alta com 6 critérios (força isocinética, saltos, agilidade, corrida) e registro de rupturas do enxerto.',r:['Quem não cumpriu todos os critérios teve cerca de 4 vezes mais ruptura do enxerto.','Relação isquio:quadríceps mais baixa no lado operado aumentou o risco.','Mais tempo até o retorno também ajudou.'],l:'Só homens e só atletas profissionais.'},
 rice10:{a:'pago',o:'Explicar por que o quadríceps "desliga" depois de lesão no joelho.',q:'Revisão.',c:'Reúne estudos de neurofisiologia e reabilitação.',r:['Inchaço, inflamação e lesão dos receptores do joelho mandam sinais que inibem o quadríceps por reflexo na medula (inibição artrogênica).','Isso tira força e explosão mesmo sem perda de massa muscular.','Gelo, estimulação elétrica (TENS/NMES) e exercício precoce podem reduzir a inibição e melhorar o ganho de força.'],l:'Muitos estudos citados são pequenos.'},
 hew05:{a:'pago',o:'Ver se o jeito de aterrissar prevê lesão do LCA.',q:'205 atletas adolescentes do sexo feminino (futebol, basquete e vôlei).',c:'Análise 3D de um salto de queda antes da temporada e registro das lesões.',r:['As que romperam o LCA tinham joelho mais "para dentro" (valgo) e maior carga de valgo na aterrissagem.','A carga de valgo no joelho previu a lesão com boa sensibilidade.','Treino neuromuscular que corrige a aterrissagem é a base da prevenção.'],l:'Só mulheres jovens e poucas lesões no total.'},
 khay16:{a:'pago',o:'Ver se a força do quadril prevê lesão do LCA sem contato.',q:'Cerca de 500 atletas de vários esportes, homens e mulheres, acompanhados prospectivamente.',c:'Força isométrica de abdução e rotação externa do quadril com dinamômetro manual antes da temporada.',r:['Quem tinha abdução e rotação externa do quadril mais fracas teve mais lesão do LCA.','Valeu para homens e mulheres.','Reforça treinar glúteos na prevenção e na reabilitação.'],l:'Poucas lesões no total; os pontos de corte precisam ser confirmados em outros grupos.'},
 pet11:{a:'pago',o:'Ver se o treino de nórdico previne lesão de posterior de coxa.',q:'Cerca de 940 jogadores de futebol de 50 times dinamarqueses.',c:'Ensaio randomizado: metade dos times fez um programa de 10 semanas de nórdico e depois manutenção.',r:['O grupo do nórdico teve cerca de 70% menos lesões de posterior.','As lesões recorrentes caíram cerca de 85%.','O programa é simples e não precisa de equipamento.'],l:'A adesão ao programa variou entre times.'},
 opar15:{a:'pago',o:'Ver se a força excêntrica no nórdico prevê lesão de posterior.',q:'210 jogadores de futebol australiano.',c:'Força no nórdico com aparelho (NordBord) no início e no fim da pré-temporada e no meio da temporada.',r:['Abaixo de 256 N por perna no início da pré-temporada: risco cerca de 2,7 vezes maior.','Abaixo de 279 N no fim da pré-temporada: risco cerca de 4,3 vezes maior.','A diferença entre as pernas não foi um bom preditor neste estudo.'],l:'Esporte diferente do basquete; os valores em N não levam em conta o peso.'},
 tyl01:{a:'pago',o:'Ver se força e flexibilidade do quadril preveem estiramento de virilha.',q:'47 jogadores profissionais de hóquei no gelo.',c:'Força de adução e abdução com dinamômetro na pré-temporada e registro das lesões.',r:['Quem tinha adução abaixo de 80% da abdução teve cerca de 17 vezes mais estiramento de adutor.','A flexibilidade não previu lesão.','Um programa de fortalecimento de adutores reduziu as lesões depois disso.'],l:'Amostra pequena e esporte bem diferente.'},
 thor11:{a:'pago',o:'Descrever a força de adução e abdução em jogadores de elite e como usar isso no retorno depois de lesão.',q:'Jogadores de futebol de elite.',c:'Força isométrica com dinamômetro manual nos dois lados.',r:['A diferença entre os lados em jogadores sem lesão é pequena.','Por isso, comparar com o outro lado é um bom critério de recuperação dos adutores.','Fornece valores de referência por peso corporal.'],l:'Só homens jogadores de futebol.'},
 byr10:{a:'pago',o:'Ver se a força do ombro na pré-temporada prevê lesão em arremessadores.',q:'Arremessadores profissionais de beisebol, acompanhados por várias temporadas.',c:'Força com dinamômetro manual de rotação externa, interna e do supraespinhal antes da temporada.',r:['Rotação externa fraca previu lesões do ombro.','Relação rotação externa/interna baixa também esteve ligada a mais lesão.','Supraespinhal fraco esteve ligado a lesões que precisaram de cirurgia.'],l:'Beisebol: a carga no ombro é maior que no basquete.'},
 wilk02:{a:'pago',o:'Organizar a reabilitação do atleta que arremessa acima da cabeça.',q:'Comentário clínico de especialistas.',c:'Revisão e experiência clínica.',r:['Recomenda rotação externa entre 66% e 75% da interna.','Defende fortalecer os rotadores externos e os músculos da escápula para proteger o ombro.','Descreve fases de reabilitação até o retorno ao arremesso.'],l:'É uma recomendação de especialistas, não um estudo com grupo de comparação.'},
 boh15:{a:'pago',o:'Resumir o valor da preensão manual como medida de saúde.',q:'Revisão.',c:'Reúne estudos populacionais.',r:['Preensão baixa está ligada a mais incapacidade, doenças e mortalidade.','É um teste rápido, barato e confiável.','Serve como marcador da força geral do corpo.'],l:'Foco em adultos e idosos, não em atletas.'},
 mcg99:{a:'pago',o:'Criar valores normais de resistência do tronco.',q:'Adultos jovens saudáveis.',c:'Tempo máximo segurando posições de flexão do tronco, extensão (teste de Biering-Sørensen) e prancha lateral dos dois lados.',r:['Os extensores aguentam mais tempo que os flexores.','Relações sugeridas: flexão ÷ extensão abaixo de 1,0; prancha lateral ÷ extensão abaixo de 0,75; esquerda ÷ direita dentro de 0,05.','O desequilíbrio entre essas relações está ligado a dor lombar.'],l:'Mede resistência (tempo), não força máxima; no app usamos como guia de equilíbrio.'},
 hert02:{a:'aberto',o:'Explicar por que o tornozelo fica instável depois de entorses.',q:'Revisão.',c:'Reúne estudos de anatomia, biomecânica e controle motor.',r:['A instabilidade pode ser mecânica (ligamento frouxo) e/ou funcional (controle ruim).','Há perda de propriocepção, demora para os fibulares reagirem, fraqueza e déficit de equilíbrio.','A reabilitação deve incluir força, equilíbrio e controle, não só repouso.'],l:'Revisão narrativa.'},
 jar02:{a:'pago',o:'Discutir como comparar força entre pessoas de tamanhos diferentes.',q:'Revisão.',c:'Teoria de escala e dados de vários estudos.',r:['Dividir a força pelo peso favorece as pessoas leves.','A força cresce mais ou menos com o peso elevado a 0,67 (alometria), o que dá comparações mais justas.','Para torque, o expoente sugerido é maior (cerca de 1).'],l:'Os expoentes variam entre grupos; são aproximações.'},
 mca00:{a:'aberto',o:'Explicar os tipos de tremor e de onde eles vêm.',q:'Revisão.',c:'Reúne estudos de neurofisiologia.',r:['O tremor normal tem uma parte mecânica e outra de 8–12 Hz que vem do sistema nervoso central.','Cansaço, estresse, cafeína e falta de sono aumentam o tremor.','Medir o tremor ajuda a ver a qualidade do controle da força.'],l:'Foco clínico e neurológico, não esportivo.'},
 heb17:{a:'pago',o:'Revisar como é feito o teste de panturrilha (elevação do calcanhar).',q:'Revisão sistemática.',c:'Analisa protocolos e confiabilidade dos estudos.',r:['Os protocolos variam muito (ritmo, altura, critérios de parada).','Recomenda padronizar e comparar sempre os dois lados.','É útil no retorno depois de lesões de tornozelo e do tendão de Aquiles.'],l:'É sobre o teste de repetições, não sobre força isométrica.'},
 sar21:{a:'aberto',o:'Criar valores de referência de força isométrica do joelho.',q:'13.893 pessoas de 411 estudos (meta-análise).',c:'Converteram todos os valores para N·m por kg e separaram por ângulo do joelho, sexo e idade.',r:['Homens adultos saudáveis, extensão: 2,92–3,45 N·m/kg (ângulo intermediário) e 2,50–3,06 N·m/kg (joelho dobrado).','Homens, flexão: 0,85–1,20 (estendido), 1,15–1,62 (intermediário) e 0,96–1,54 N·m/kg (dobrado).','Mulheres adultas, extensão: 1,01–1,50, 2,08–2,74 e 2,04–2,71 N·m/kg.','Idosos ficam abaixo; não deu para criar referências específicas para atletas.'],l:'As faixas são da média dos estudos, não da variação entre pessoas.'},
 mos17:{a:'pago',o:'Criar valores normais de força e mobilidade do quadril em jogadores profissionais.',q:'394 jogadores de futebol profissionais do Catar, de 18 a 40 anos.',c:'Dinamômetro manual: adução e abdução excêntricas deitado de lado e squeeze deitado com quadril a 45°.',r:['Adução: 3,0 ± 0,6 N·m/kg; abdução: 2,6 ± 0,4 N·m/kg.','Relação adução/abdução: 1,2 ± 0,2.','Squeeze a 45°: 3,6 ± 0,8 N/kg, caindo cerca de 0,03 N/kg por ano de idade.','Lesões anteriores e etnia não mudaram os valores.'],l:'Só atletas profissionais homens; os testes excêntricos dão números maiores que os isométricos.'},
 ram14:{a:'aberto',o:'Criar valores normais de abdução de quadril em pessoas ativas.',q:'831 corredores iniciantes saudáveis.',c:'Força excêntrica de abdução com dinamômetro manual.',r:['Homens: 1,62 ± 0,38 N·m/kg; mulheres: 1,41 ± 0,33 N·m/kg.','A força cai um pouco com a idade.','Fórmula: 1,600 − 0,005 × idade + 0,215 (se homem) N·m/kg.'],l:'Corredores iniciantes, não atletas de quadra.'},
 jean23:{a:'aberto',o:'Descrever a força excêntrica no nórdico em jovens atletas e profissionais.',q:'244 jovens atletas (12–18 anos) e 346 jogadores profissionais do Catar.',c:'NordBord, média das pernas em 3 repetições.',r:['Profissionais: cerca de 297 N (4,2 N/kg).','Jovens atletas: cerca de 272 N (4,7 N/kg).','Dividir pelo peso é a melhor forma de comparar atletas de idades e tamanhos diferentes.'],l:'Só homens; aparelho específico (NordBord).'},
 dod14:{a:'aberto',o:'Criar curvas de preensão manual ao longo da vida.',q:'Quase 50 mil pessoas de 12 estudos britânicos.',c:'Juntaram as medidas e criaram curvas de percentis de 4 a 90 anos.',r:['O pico (mediana) é 51 kg nos homens entre 29 e 39 anos e 31 kg nas mulheres entre 26 e 42 anos.','A força sobe até o início da vida adulta, fica estável até a meia-idade e depois cai.','"Preensão fraca" = 2,5 desvios abaixo do pico.'],l:'População geral britânica, não atletas.'},
 mich21:{a:'aberto',o:'Descrever a força de rotação do ombro em jogadores profissionais de beisebol.',q:'Jogadores profissionais, separados entre arremessadores e jogadores de posição.',c:'Dinamômetro manual fixado na parede, sentado, braço ao lado do corpo.',r:['Jogadores de posição, braço de arremesso: rotação externa 0,7–2,7 N/kg e interna 1,3–3,8 N/kg.','Arremessadores: rotação externa 0,5–2,5 N/kg e interna 0,6–4,2 N/kg.','Jogadores de posição foram 14–20% mais fortes que os arremessadores.'],l:'Beisebol; as faixas são amplas.'},
 fon25:{a:'aberto',o:'Criar valores normais de força do tornozelo em adultos ativos.',q:'200 tornozelos de adultos ativos sem lesão.',c:'Isocinético (Biodex) de eversão, inversão, dorsiflexão e flexão plantar.',r:['Homens: eversão 33,4 ± 9,9, inversão 37,0 ± 11,6, dorsiflexão 53,6 ± 13,0 N·m.','Mulheres: eversão 22,3 ± 6,6, inversão 30,1 ± 10,0, dorsiflexão 37,4 ± 10,0 N·m.','A diferença entre os lados ficou abaixo de 10%: simetria acima de 90% é o alvo para o retorno.'],l:'Isocinético: não é comparável diretamente com a célula de carga.'},
 acl22:{a:'aberto',o:'Descrever a recuperação da força do quadríceps depois do LCA por sexo, enxerto e menisco.',q:'125 pessoas operadas do LCA (enxertos de isquiotibiais, de patelar e de tendão do quadríceps).',c:'Isométrico do quadríceps a 90° aos 3, 6 e 9 meses.',r:['Homens tiveram força relativa maior que mulheres em todos os momentos.','Com enxerto de isquiotibiais, a simetria do quadríceps foi maior que com patelar ou tendão do quadríceps.','Ter mexido no menisco junto não mudou a força.'],l:'Estudo retrospectivo de um centro.'},
 acl23:{a:'aberto',o:'Ver se a força do quadríceps aos 6 meses depois do LCA está ligada aos sintomas no joelho.',q:'Pessoas entre 5 e 7 meses depois da reconstrução do LCA.',c:'Força isométrica do quadríceps e questionários de sintomas.',r:['85% não cumpriam nem quadríceps ≥ 3,0 N·m/kg nem simetria ≥ 90%.','O critério de 3,0 N·m/kg é o mais difícil de atingir entre 6 e 9 meses.','A força, sozinha, não explicou bem os sintomas nessa fase.'],l:'Medida em um só momento.'},
 acl25:{a:'aberto',o:'Descrever a evolução da força de quadríceps e isquiotibiais ao longo dos anos depois do LCA.',q:'Revisão sistemática com meta-análise longitudinal.',c:'Juntou estudos com medidas em vários momentos depois da cirurgia.',r:['A força melhora rápido no primeiro ano.','Desacelera entre 12 e 18 meses.','Quase não melhora depois disso; déficits podem ficar por anos.'],l:'Estudos com métodos de medida diferentes.'},
 rat09:{a:'aberto',o:'Reunir as recomendações para progredir no treino de força.',q:'Revisão de centenas de estudos com adultos saudáveis.',c:'Posicionamento de especialistas do ACSM com base na literatura.',r:['Força: iniciantes 60–70% da carga máxima, 8–12 repetições; avançados 80–100%, 1–6 repetições.','Potência: cargas leves a moderadas movidas o mais rápido possível, 3–6 repetições.','Resistência muscular: cargas leves, 10–25 repetições, descanso curto.','Iniciantes: 2–3 sessões por semana por grupo muscular.'],l:'Recomendações gerais; a resposta individual varia.'},
 lum19:{a:'pago',o:'Resumir o efeito do treino isométrico na força e no desempenho.',q:'Revisão de estudos com treino isométrico.',c:'Comparou tipos de isometria (ângulo, intensidade, explosiva ou sustentada).',r:['A isometria aumenta a força máxima.','O ganho é maior perto do ângulo treinado.','Isometria explosiva melhora a força rápida.','Treinar com o músculo alongado transfere mais.'],l:'Estudos pequenos e com protocolos variados.'},
 till14:{a:'pago',o:'Comparar treino explosivo e treino de força máxima.',q:'Homens jovens sem treino de força.',c:'4 semanas: um grupo fez contrações curtas e explosivas, outro contrações longas e fortes.',r:['O treino explosivo melhorou mais a força nos primeiros milissegundos.','O treino sustentado melhorou mais a força máxima.','Conclusão: treine a capacidade que quer melhorar.'],l:'Curta duração e amostra pequena.'},
 mark07:{a:'aberto',o:'Medir quanto a pliometria aumenta o salto vertical.',q:'Meta-análise de estudos controlados com pessoas saudáveis.',c:'Juntou os resultados de vários programas de pliometria.',r:['Salto com contramovimento: cerca de +8,7%.','Salto sem contramovimento: cerca de +4,7%.','Salto com braços: cerca de +7,5%.'],l:'Programas muito diferentes entre si.'},
 bish11:{a:'pago',o:'Recomendar como treinar a capacidade de repetir sprints.',q:'Revisão da literatura.',c:'Analisou treinos intervalados, sprints repetidos e treino aeróbio.',r:['A capacidade de recuperar entre esforços depende muito da base aeróbia.','Combinar sprints repetidos com intervalados de alta intensidade é o mais eficaz.'],l:'Revisão narrativa.'},
 les15:{a:'pago',o:'Achar a dose ideal de treino de equilíbrio.',q:'Meta-análise de estudos com jovens saudáveis.',c:'Relacionou duração, frequência e volume ao ganho.',r:['O treino de equilíbrio teve efeito grande no equilíbrio.','Doses mais eficazes: ~3 sessões por semana, 11–15 min, 11–12 semanas, séries de 21–40 s.'],l:'O ganho é específico da tarefa treinada.'},
 web18:{a:'pago',o:'Resumir se programas de prevenção reduzem lesões do LCA.',q:'Meta-análise de meta-análises.',c:'Juntou as revisões sobre programas neuromusculares.',r:['Os programas reduziram as lesões do LCA em cerca de 50%.','O efeito foi maior em lesões sem contato e em atletas jovens.'],l:'Programas variados e adesão diferente.'},
 alat17:{a:'pago',o:'Ver se programas com o exercício nórdico previnem lesões de posterior.',q:'Meta-análise com jogadores de futebol.',c:'Comparou equipes com e sem o exercício nórdico.',r:['Redução de cerca de 51% nas lesões de posterior da coxa.'],l:'Estudos só com futebol.'},
 har19:{a:'aberto',o:'Ver se o exercício Copenhagen previne problemas de virilha.',q:'Times de futebol masculino na Noruega.',c:'Metade dos times fez o programa com o Copenhagen durante a temporada.',r:['Cerca de 41% menos problemas de virilha.','O programa leva poucos minutos por semana.'],l:'Só homens jogadores de futebol.'},
 eit09:{a:'pago',o:'Ver se a força do quadríceps antes da cirurgia prevê o resultado depois.',q:'Pessoas com lesão do LCA que fizeram reabilitação antes da reconstrução (coorte norueguesa).',c:'Força do quadríceps medida antes da cirurgia e função do joelho avaliada 2 anos depois.',r:['Déficit de força do quadríceps acima de 20% antes da cirurgia previu pior função 2 anos depois.','Reforça a pré-reabilitação: chegar à cirurgia com o quadríceps forte e o joelho calmo.'],l:'Amostra de um centro; a força é um dos vários fatores.'},
 rt92:{a:'pago',o:'Valor clássico de tempo de reação simples.',q:'Citado em vários estudos com atletas.',c:'Tempo entre o estímulo e a resposta.',r:['Reação a som: em média 140–160 ms.','Reação a estímulo visual: em média 180–200 ms.','Atletas, gente descansada e treinada tendem a ser mais rápidos; idade, cansaço, álcool e nicotina pioram.'],l:'Referência antiga e citada de segunda mão; vale mais comparar com você mesmo.'}

function studyUses(k){const u=[];Object.entries(MUS).forEach(([id,M])=>{if(M.sci.some(([,rf])=>rf.includes(k)))u.push(['Músculos: '+T[id].n,'#t-'+id+'?tab=musc'])});
 Object.entries(KN).forEach(([id,K])=>{if(K.it.some(it=>it.src===k))u.push(['Referência normal: '+T[id].n,'#t-'+id])});
 Object.entries(AXREF).forEach(([f,rf])=>{if(rf.includes(k))u.push(['Métrica: '+({forca:'força',pct:'percentil',rfd:'explosão',exp:'índice de explosão',ttp:'tempo até o pico',cv:'oscilação',rfr:'relaxamento'}[f]||f),'#evolucao'])});
 if(['grin16','kyr16'].includes(k))u.push(['Simetria e critérios do LCA','#lca']);return u}

function hCell(S,s){if(!S||!S.pts.length)return {h:'<span class="mute">—</span>',sc:null};const P=S.pts.filter(o=>Number.isFinite(o.v));if(!P.length)return {h:'<span class="mute">—</span>',sc:null};
 const l=P[P.length-1],pv=P[P.length-2],sc=memScore(S,l.v),c=sc>=60?'var(--good)':sc>=40?'var(--warn)':'var(--bad)';let ar='';
 if(pv){const d=l.v-pv.v,b=S.dn?-d:d;ar=Math.abs(b)<S.eps?'<small class="mute">=</small>':`<small style="color:${b>0?'var(--good)':'var(--bad)'}">${b>0?'▲':'▼'}</small>`}

 SS.forEach(S=>{const c=S.s==='E'?'var(--sideE)':S.s==='D'?'var(--sideD)':'var(--acc)';o+=`<path class="dr" d="${S.pts.map((q,i)=>(i?'L':'M')+X(q.d).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.4"/>`;S.pts.forEach(q=>{o+=`<circle cx="${X(q.d)}" cy="${Y(q.v)}" r="3.5" fill="${c}" stroke="var(--card)" stroke-width="1.2"/>`+tipPt(X(q.d),Y(q.v),`Semana de ${dFmt(q.d-3.5*DAY)}${S.s!=='-'?' · '+sideName(S.s):''}\nnota ${fmt(q.v,0)} (${q.n} medida${q.n>1?'s':''})`,c)});const l=S.pts[S.pts.length-1];o+=vlab(X(l.d),Y(l.v),fmt(l.v,0),c)});

/* ---------- ÂNGULO E EXECUÇÃO ---------- */
const JL={quad:'Joelho',post:'Joelho',quadril:'Quadril',perna:'Tornozelo',ombro:'Ombro',peito:'Cotovelo',costas:'Cotovelo',braco:'Cotovelo',antebraco:'Cotovelo',core:'Tronco'};
const jTarget=t=>t.ang!=null?t.ang:t.g==='core'?0:90;
function angSeries(t,prm,n,F){ // 100 Hz
 const N=Math.ceil(n/10),out=new Float32Array(N),tg=jTarget(t);
 if(!prm){out.fill(tg);return out}
 const r=rng((prm.sd||1)+77),sg=r()<.5?-1:1,tc=1.5+r()*.9,hold=prm.hold||3.4,t1=(prm.t0||1)+hold,pk=prm.pk||1;
 let w=0;for(let i=0;i<N;i++){const t2=i/100;w=w*.9+gauss(r)*.12;let v=tg+w*.4;
  const f=F?F[Math.min(F.length-1,i*10)]:0;v+=sg*.9*(f/pk);
  if(prm.ang>0&&t2>tc&&t2<t1+.1)v+=sg*prm.ang*clamp((t2-tc)/.6,0,1);
  out[i]=v}
 return out;
}
function execCheck(rec){
 const t=T[rec.t],m=rec.m,prm=rec.prm,pt=rec.pt||'max',F=curveOf(rec),A=angSeries(t,prm,F.length,F),tg=jTarget(t);
 const on=Math.round(m.on*100),off=Math.min(A.length-1,on+Math.round(((prm&&prm.hold)||3.4)*100));
 let mx=0,sum=0,c=0,i0=-1,i1=-1;for(let i=on;i<=off;i++){const d=Math.abs(A[i]-tg);sum+=A[i];c++;if(d>mx)mx=d;if(d>5){if(i0<0)i0=i;i1=i}}
 const avgA=c?sum/c:tg,os=m.pm>0?(m.pk-m.pm)/m.pm*100:0;
 const L=[];const add=(st,n,v,txt)=>L.push({st,n,v,txt});
 add(mx<=3?2:mx<=5?1:0,`${JL[t.g]}: ângulo`,`${fmt(avgA,1)}° (alvo ${tg}°), variação máx. ${fmt(mx,1)}°`,mx>5?`<b>Roubo:</b> o ${JL[t.g].toLowerCase()} saiu ${fmt(mx,0)}° do lugar entre ${fmt(i0/100,1)} s e ${fmt(i1/100,1)} s. Mudar o ângulo muda o braço de alavanca e o músculo que trabalha, então a força não é comparável.`:mx>3?'Mexeu um pouco; ainda aceitável, mas tente travar melhor.':'Posição travada durante toda a força.');
 add(m.pre>.6?0:2,'Pré-tensão',`${fmt(m.pre,1)} kgf antes do ${pt==='reac'?'bip':'PUXE'}`,m.pre>.6?'<b>Roubo:</b> já estava puxando antes do sinal. Isso "rouba" o início da subida e distorce a explosão.':'Começou relaxado, como deve ser.');
 if(pt==='max')add(os>10?0:os>7?1:2,'Tranco no início',`pico ${fmt(os,0)}% acima do platô`,os>10?'<b>Roubo:</b> deu um tranco (impulso) no começo. O pico fica inflado e não representa a força sustentada.':'Subida limpa, sem impulso.');
 if(pt!=='pot'&&pt!=='reac')add(m.plat<1?0:m.plat<2?1:2,'Tempo de platô',`${fmt(m.plat,1)} s acima de 90% do pico`,m.plat<1?'Soltou cedo demais: a força máxima pode não ter sido alcançada.':'Segurou o suficiente.');
 if(pt==='max')add(m.cv>4?0:m.cv>2.5?1:2,'Tremor no platô',`oscilação ${fmt(m.cv,1)}%`,m.cv>4?'Força instável: pode ser fadiga ou posição ruim.':'Estável.');
 const bad=L.filter(x=>x.st===0).length,warn=L.filter(x=>x.st===1).length;
 return {L,A,tg,i0,i1,mx,os,bad,warn,cheat:L.some(x=>x.st===0&&/Roubo/.test(x.txt))};
}
function execCard(rec){

 return `<div class="card" style="margin-top:10px;${E.cheat?'border:2px solid var(--bad)':''}"><div class="row sb"><h3>Execução</h3><span class="badge" style="background:${E.bad?'var(--bad)':E.warn?'var(--warn)':'var(--good)'};color:#fff">${E.cheat?'Teve roubo':E.bad?'Com problema':E.warn?'Quase limpa':'Limpa'}</span></div>
 ${E.L.map(x=>`<div class="row" style="gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)"><b style="color:${cl[x.st]};font-size:18px;width:18px">${ic[x.st]}</b><div style="flex:1"><div class="row sb"><b>${x.n}</b><span class="small mute" style="text-align:right">${x.v}</span></div><p class="small" style="margin:2px 0 0">${x.txt}</p></div></div>`).join('')}
 ${E.cheat?'<p class="small" style="color:var(--bad);margin:8px 0 0">Esta tentativa não deve contar para a evolução. Repita com a posição travada.</p>':''}</div>`;
}
function angleSVG(rec,W,pl,pr){

 [lo,tg,hi].forEach(v=>o+=`<text x="${pl-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--mute)">${fmt(v,0)}°</text>`);o+=`<text x="2" y="9" font-size="9" font-weight="700" fill="var(--mute)">↑ ângulo da articulação (graus)</text><text x="${W-pr}" y="${H-4}" font-size="8.5" text-anchor="end" fill="var(--mute)">tempo da tentativa →</text>`;
 if(E.i0>=0)o+=`<rect x="${X(E.i0)}" y="${pt}" width="${Math.max(2,X(E.i1)-X(E.i0))}" height="${H-pt-pb}" fill="rgba(240,70,70,.18)"/><text x="${(X(E.i0)+X(E.i1))/2}" y="${H-pb-4}" font-size="10" text-anchor="middle" fill="var(--bad)" font-weight="700">roubo ${fmt(E.mx,0)}°</text>`;

}

function showGuide(t,pt){
 const G=GUIDE[t.id];if(!G)return;pt=pt||'max';
 const L=a=>`<ul style="margin:4px 0 0;padding-left:18px">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 sheet(`<span class="tag" style="color:#2fa3ff">Como fazer</span><h2 style="margin:6px 0 2px">${t.n}</h2><p class="mute" style="margin:0 0 8px">${t.m} · ${GROUPS[t.g]}</p>
 <div class="figbox" style="margin-bottom:6px"><svg class="fig" id="gFig" viewBox="0 0 220 220"></svg></div>
 <p class="note" style="margin:0 0 10px;text-align:center"><b style="color:#2fa3ff">Seta azul</b> = sentido do movimento. No teste a articulação fica travada (isométrico).</p>
 <div class="card" style="background:var(--card2)"><h3>O que é</h3><p style="margin:4px 0 0">${G.o}</p><p style="margin:6px 0 0"><b>Músculos:</b> ${G.mus}</p></div>
 <div class="card"><h3>Posição e ângulos</h3>${L(G.pos)}</div>
 <div class="card"><h3>Onde prender a cinta e a corrente</h3>${L(G.fix)}</div>
 <div class="card"><h3>O que fazer</h3><p style="margin:4px 0 0">${G.faz}</p><p style="margin:8px 0 0"><b>Tempo e repetições (${PROTO[pt].n.toLowerCase()}):</b> ${PDOSE[pt]}</p></div>
 <div class="card" style="border-left:4px solid var(--bad)"><h3>Erros comuns (o app detecta "roubo")</h3>${L(G.err)}</div>
 <div class="card"><h3>No basquete</h3><p style="margin:4px 0 0">${G.bb}</p></div>
 <div class="card" style="border-left:4px solid var(--warn)"><h3>Cuidados</h3><p style="margin:4px 0 0">${G.seg} Pare se sentir dor aguda.</p></div>
 <button class="btn w" data-close style="margin-top:6px">Entendi</button>`);
 mountFig($('#gFig'),t);
}

/* explica a dose: "3 × 10" → "3 séries de 10 repetições" */
function doseTxt(d){if(!d)return '';let m;
 if((m=d.match(/^(\d+)(?:[–-](\d+))?\s*×\s*(\d+)(?:[–-](\d+))?\s*(s|min)\b/)))return `${m[1]}${m[2]?' a '+m[2]:''} ${+m[1]===1&&!m[2]?'vez':'vezes'}, segurando ${m[3]}${m[4]?' a '+m[4]:''} ${m[5]==='s'?'segundos':'minutos'} cada uma.`;
 if((m=d.match(/^(\d+)(?:[–-](\d+))?\s*×\s*(\d+)(?:[–-](\d+))?/)))return `${m[1]}${m[2]?' a '+m[2]:''} séries de ${m[3]}${m[4]?' a '+m[4]:''} repetições${/cada/.test(d)?' em cada lado':''}. Uma "série" é um bloco de repetições seguidas; entre um bloco e outro você descansa.`;
 if((m=d.match(/^(\d+)×\s*de\s*(\d+)\s*min/)))return `${m[1]} vezes por dia, ${m[2]} minutos cada vez.`;
 return d}

function calChart(c){const W=320,H=150,pl=34,pr=8,pt=18,pb=22,mx=Math.max(...c.pts.map(p=>p.kg))*1.1||1,my=Math.max(...c.pts.map(p=>p.raw))*1.1||1,X=k=>pl+k/mx*(W-pl-pr),Y=r=>pt+(1-r/my)*(H-pt-pb);

function calWizard(){

 const step=()=>{const n=st.pts.length;
  if(st.i===0)sheet(`<h2 style="margin:0 0 6px">Calibração · passo 1</h2><p><b>Zerar (tara):</b> deixe a célula pendurada, sem nenhum peso e sem a corrente puxando. Não encoste.</p><div class="figbox" style="padding:20px;text-align:center;font-size:40px">⚖️</div><button class="btn w" id="cOk" style="margin-top:10px">Medir o zero</button>`);
  else if(st.i===1)sheet(`<h2 style="margin:0 0 6px">Calibração · peso ${n+1}</h2><p>Pendure um peso que você <b>sabe exatamente</b> quanto pesa: anilha, galão de água (1 L ≈ 1 kg) ou saco pesado numa balança. Use de 5 a 30 kg. Quanto mais pesos diferentes, melhor (mínimo 2).</p><label class="field">Peso pendurado (kg)<input id="cKg" type="number" step="0.1" inputmode="decimal" value="${n===0?10:n===1?20:30}"></label>
   ${n?`<p class="small">Já medidos: ${st.pts.map(p=>p.kg+' kg').join(', ')}</p>`:''}<button class="btn w" id="cOk" style="margin-top:10px">Medir este peso (fica 3 s parado)</button>${n>=2?'<button class="btn ghost w" id="cEnd" style="margin-top:8px">Terminar e calcular</button>':''}`);
  else{const xs=st.pts.map(p=>p.kg),ys=st.pts.map(p=>p.raw);xs.unshift(0);ys.unshift(st.zero);const mx=avg(xs),my=avg(ys);let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});const f=nu/de,o=my-f*mx;
   let ssr=0,sst=0,maxe=0;xs.forEach((x,i)=>{const p=o+f*x;ssr+=(ys[i]-p)**2;sst+=(ys[i]-my)**2;maxe=Math.max(maxe,Math.abs(ys[i]-p)/f)});const r2=1-ssr/sst,lin=maxe/100*100;
   const c={d:Date.now(),factor:f,offset:o,r2,lin,pts:st.pts.concat([{kg:0,raw:st.zero}])};calLog().push(c);save();
   sheet(`<h2 style="margin:0 0 6px">Calibração concluída</h2><div class="mgrid"><div><b>${fmt(f,0)}</b><span>contagens/kg</span></div><div><b style="color:${lin<=.5?'var(--good)':'var(--warn)'}">${fmt(lin,2)}%</b><span>linearidade (do fundo de escala)</span></div><div><b>${fmt(r2,5)}</b><span>R²</span></div></div>${calChart(c)}<p class="small">${lin<=.5?'Ótimo: a célula está linear e pronta para uso.':'Linearidade acima de 0,5%: confira se os pesos estavam parados e se a corrente não encostou.'}</p><button class="btn w" data-close>Pronto</button>`);
   setTimeout(()=>{if(location.hash==='#hw')route()},50);return}
  $('#cOk').onclick=()=>{const b=$('#cOk');b.disabled=true;b.textContent='Medindo…';setTimeout(()=>{if(st.i===0){st.zero=read(0);st.i=1}else{const kg=parseFloat(String($('#cKg').value).replace(',','.'));if(!(kg>0&&kg<=100)){toast('Use um peso entre 0 e 100 kg');b.disabled=false;b.textContent='Medir este peso';return}st.pts.push({kg,raw:read(kg)});beep(880)}step()},1500)};
  const e=$('#cEnd');if(e)e.onclick=()=>{st.i=2;step()}};
 step();
}

const NIVEL={ini:{n:'Começando na academia',lo:1,hi:2,why:'Nos primeiros meses quase todo o ganho vem do sistema nervoso aprendendo a recrutar o músculo, por isso a força sobe rápido.'},

const LSI_EXP=[[0,25,40],[6,40,55],[12,55,70],[24,70,85],[36,82,95],[52,90,100],[80,92,100]];
function lsiExp(w){for(let i=1;i<LSI_EXP.length;i++){const a=LSI_EXP[i-1],b=LSI_EXP[i];if(w<=b[0]){const f=(w-a[0])/(b[0]-a[0]);return [a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}}return LSI_EXP[LSI_EXP.length-1].slice(1)}
function postOpWeek(){const p=prof();if(!p.op||!p.cir||isNaN(new Date(p.cir))||p.lcaSt==='pre'||p.lcaSt==='cons'||new Date(p.cir)>Date.now())return null;return Math.max(0,(Date.now()-new Date(p.cir))/7/DAY)}

  return {k:'lca',n:`Recuperação do LCA · semana ${Math.floor(w)}`,lo,hi,why:w<12?'Fase inicial: o músculo da coxa desliga depois da cirurgia (inibição) e volta rápido quando o comando nervoso reacende.':w<24?'Fase de fortalecimento: os ganhos continuam bons, mas já dependem de carga progressiva.':'Fase final: os ganhos ficam mais lentos; o foco é fechar a diferença para o outro lado e recuperar a explosão.'};

function evoStats(t,s){

 const r=h.filter(x=>x.d>l.d-56*DAY);const x=r.map(q=>q.d/DAY/7),y=r.map(q=>q.m.pk);

const STC=['var(--bad)','var(--warn)','var(--good)'];
function prevBox(t,pt){

  <p style="margin:0 0 6px"><b>O que significa:</b> ${c.sig}</p>
  <p style="margin:0 0 6px"><b>No basquete:</b> ${c.bb}</p>
  <p style="margin:0 0 10px"><b style="color:var(--acc)">Como treinar:</b> ${c.tr}</p>
  <button class="btn ghost w" data-proto="${c.proto}">Medir com o protocolo de ${PROTO[c.proto].n.toLowerCase()}</button></section>`).join('')}
 <p class="note">Sugestões de treino são gerais. Durante a reabilitação, siga o que o seu fisioterapeuta liberar. Referências provisórias.</p>`;
 hydrateMini(v);
 requestAnimationFrame(()=>requestAnimationFrame(()=>v.querySelectorAll('.cap').forEach(b=>b.style.width=b.dataset.w+'%')));
 v.querySelectorAll('[data-proto]').forEach(b=>b.onclick=()=>pickTest(b.dataset.proto));

function ilCurve(sc){const p=[];for(let x=20;x<=250;x+=2){let y=0;if(x>=45&&x<190){y=(1-Math.exp(-(x-45)/12))*(1-.08*(x-45)/145)}else if(x>=190)y=.92*Math.exp(-(x-190)/9);p.push([x,96-y*68*(sc||1)])}return p}

 <details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700;min-height:30px">Como funciona e como configurar (uma vez só)</summary><div class="small">
 <p><b>Como funciona:</b> o app guarda um arquivo <code>${GDNAME}</code> no seu Drive. Ao abrir, ele baixa esse arquivo e <b>junta</b> com o que tem no aparelho (soma, sem duplicar; tentativas apagadas continuam apagadas). Depois de cada treino, sobe a versão juntada. Em qualquer celular com o mesmo Client ID e a mesma conta Google, os dados ficam iguais. Dados de demonstração não vão para o Drive.</p>
 <p><b>Configurar (10 minutos, uma vez):</b></p><ol style="padding-left:18px;margin:0">
 <li>Coloque o app num site grátis (GitHub Pages ou Netlify): o login do Google não funciona com arquivo aberto direto.</li>

  try{a.content='';askRender();const conv2=conv.map((m,i)=>i===conv.length-1?{...m,content:m.content+'\n\n### Conhecimento do app (use isto em vez de ferramentas)\n'+askKB()}:m);r=await ASK.sample(conv2,{cache:false,onText:({text})=>{a.content=text;askRender()}});err=null}catch(e2){err=e2}}

 catch(e){a.content=e&&e.code==='rate_limited'?'Muitas perguntas seguidas. Espere um pouco e tente de novo.':e&&e.code==='not_granted'?'Você não autorizou o assistente nesta página.':'Não consegui responder agora. Tente de novo.'+(e&&(e.text||e.message||e.code)?'\n(detalhe: '+String(e.code||'')+' '+String(e.text||e.message||'').slice(0,160)+')':'');try{console.warn('ask',e)}catch(_){}}
}
function askKB(){const h=location.hash,id=LV&&LV.t&&LV.t.id&&T[LV.t.id]?LV.t.id:(h.match(/^#t-(\w+)/)||[])[1];let o=Object.entries(KTOP).map(([k,v])=>`[${k}] ${v}`).join('\n');
 if(LV&&LV.imu)o+=`\n[teste atual] ${IMUT[LV.id].n}: ${IMUT[LV.id].o}`;
 if(id&&T[id]){try{o+='\n[referências do teste '+T[id].n+'] '+JSON.stringify(kbTool(id)).slice(0,3500)}catch(e){}}
 const ls=TESTS.filter(t=>!t.uni).map(t=>{const v=lsi(t.id);return v!=null?t.n+' '+Math.round(v)+'%':null}).filter(Boolean).join('; ');if(ls)o+='\n[simetrias atuais] '+ls;
 return o.slice(0,9000)}
function askOpen(){ASK.cfg=false;askHead();$('#ask').classList.add('on');$('#askCtx').textContent=($('#sheet').classList.contains('on')?'Sobre o painel aberto':LV?'Sobre o teste ao vivo':'Sobre esta tela')+' e os seus dados';askRender();setTimeout(()=>$('#askIn').focus(),100)}
$('#askFab').onclick=askOpen;$('#askCfg').onclick=()=>ASK.cfg?($('#aiOk')&&$('#aiOk').click()):aiSettings();$('#askX').onclick=()=>{$('#ask').classList.remove('on');if(ASK.rec)try{ASK.rec.stop()}catch(e){}};
$('#ask').onclick=e=>{if(e.target.id==='ask')$('#askX').onclick()};
$('#askGo').onclick=()=>askSend($('#askIn').value);
$('#askIn').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askSend($('#askIn').value)}};
$('#askSpk').onclick=()=>{ASK.spk=!ASK.spk;$('#askSpk').textContent=ASK.spk?'🔊':'🔈';toast(ASK.spk?'Vou ler as respostas em voz alta':'Leitura em voz alta desligada')};
(async()=>{if(!(window.claude&&window.claude.use))return;try{ASK.sample=await claude.use('sample')}catch(e){}try{ASK.dict=await claude.use('dictation')}catch(e){}
 const mic=$('#askMic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(ASK.dict){mic.style.display='grid';let base='';ASK.dict.onPartial(({text})=>{$('#askIn').value=base+text});ASK.dict.onFinal(({text})=>{base+=text+' ';$('#askIn').value=base});ASK.dict.onState(({state})=>mic.classList.toggle('rec',state==='listening'));
  mic.onclick=()=>{if(mic.classList.contains('rec')){ASK.dict.stop().then(()=>{if($('#askIn').value.trim())askSend($('#askIn').value)}).catch(()=>{});return}base=$('#askIn').value?$('#askIn').value+' ':'';ASK.dict.start().catch(e=>{if(e&&e.code==='not_granted')mic.style.display='none'})}}
 else if(SR){mic.style.display='grid';mic.onclick=()=>{if(ASK.rec){ASK.rec.stop();return}const r=new SR();r.lang='pt-BR';r.interimResults=true;ASK.rec=r;mic.classList.add('rec');r.onresult=e=>{$('#askIn').value=[...e.results].map(x=>x[0].transcript).join('')};r.onend=()=>{mic.classList.remove('rec');ASK.rec=null;if($('#askIn').value.trim())askSend($('#askIn').value)};try{r.start()}catch(e){mic.classList.remove('rec');ASK.rec=null}}}
})();

orCallback().finally(()=>{askHead()});

const APPV='2026-11-26.3';try{const pv=localStorage.getItem('ardulab_v');if(pv&&pv!==APPV)setTimeout(()=>toast('✓ ArduLab atualizado para a versão mais nova'),1200);localStorage.setItem('ardulab_v',APPV)}catch(e){}
{const f=document.createElement('button');f.id='gdFab';f.className='chip';f.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:85;background:#2fa3ff;color:#fff;border:0;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);display:none';f.textContent='☁️ Toque para sincronizar com o Drive';f.onclick=()=>gdSync(false);document.body.appendChild(f)}
if(GD.on&&gdCan()){GD.st='precisa';gdPaint()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&GD.on&&GD.tok&&Date.now()<GD.exp-60e3){clearTimeout(GD.t);gdSync(false)}});
route();
}
